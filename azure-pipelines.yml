# HelloWorld CI - runs on a clean Microsoft-hosted VM on every push
trigger:
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

variables:
  major: 1
  minor: 0
  # +1 on every run (Azure DevOps keeps the count)
  patch: $[counter(format('{0}.{1}', variables['major'], variables['minor']), 0)]
  # the branch that gets the extra stages (SonarQube, NuGet, tag, email)
  tasksBranch: refs/heads/devops-tasks

stages:
  - stage: Build
    jobs:
      - job: Build
        steps:
          - task: UseDotNet@2
            displayName: Install .NET 10 SDK
            inputs:
              packageType: sdk
              version: 10.0.x

          # version = 1.0.<patch> -> printed + becomes the run's name
          - script: |
              VERSION=$(major).$(minor).$(patch)
              echo "Version: $VERSION"
              echo "##vso[build.updatebuildnumber]$VERSION"
              echo "##vso[task.setvariable variable=version]$VERSION"
            displayName: Version

          - script: dotnet publish HelloWorld/HelloWorld.csproj -c Release -p:Version=$(version) -o $(Build.ArtifactStagingDirectory)/app
            displayName: Build

          # build output -> Azure Artifacts feed as a Universal package
          - task: UniversalPackages@0
            displayName: Upload to Azure Artifacts
            inputs:
              command: publish
              publishDirectory: $(Build.ArtifactStagingDirectory)/app
              vstsFeedPublish: HelloWorld/helloworld-feed
              vstsFeedPackagePublish: helloworld
              versionOption: custom
              versionPublish: $(version)
              packagePublishDescription: HelloWorld console app build

  # ---- only on the devops-tasks branch ----

  - stage: SonarQube
    dependsOn: Build
    # runs only if Build passed AND this run is on devops-tasks (skipped everywhere else)
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], variables['tasksBranch']))
    jobs:
      - job: Scan
        steps:
          - task: UseDotNet@2
            displayName: Install .NET 10 SDK
            inputs:
              packageType: sdk
              version: 10.0.x

          # 1. tell the scanner where to send results (service connection + keys)
          - task: SonarCloudPrepare@4
            displayName: Prepare SonarQube analysis
            inputs:
              SonarCloud: sonarcloud
              organization: telsek
              scannerMode: dotnet
              projectKey: Telsek_HelloWorld
              projectName: HelloWorld
              projectVersion: $(major).$(minor).$(patch)

          # 2. build - the scanner watches the compile and collects the code
          - script: dotnet build HelloWorld/HelloWorld.csproj -c Release
            displayName: Build for analysis

          # 3. analyze + upload to SonarQube Cloud
          - task: SonarCloudAnalyze@4
            displayName: Run SonarQube analysis
            inputs:
              jdkversion: JAVA_HOME_21_X64

          # 4. wait for the result -> quality gate shown on the run's summary
          - task: SonarCloudPublish@4
            displayName: Publish quality gate result
            inputs:
              pollingTimeoutSec: '300'