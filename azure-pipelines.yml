# HelloWorld pipeline - runs on every push, on a clean Microsoft VM
trigger:
  - '*'

pool:
  vmImage: ubuntu-latest

variables:
  major: 1
  minor: 0
  # goes up by 1 on every run
  patch: $[counter(format('{0}.{1}', variables['major'], variables['minor']), 0)]
  version: $(major).$(minor).$(patch)
  # the extra stages only run on this branch
  tasksBranch: refs/heads/devops-tasks

stages:
  # ---- every branch ----

  - stage: Build
    jobs:
      - job: Build
        steps:
          - task: UseDotNet@2
            inputs:
              version: 10.0.x

          # print the version + use it as the run name
          - script: |
              echo "Version: $(version)"
              echo "##vso[build.updatebuildnumber]$(version)"
            displayName: Version

          # if a test fails, the run stops here and nothing gets uploaded
          - script: dotnet test HelloWorld.Tests --logger trx --results-directory $(Agent.TempDirectory)/tests
            displayName: Test

          # show the results in the run's Tests tab (also when a test failed)
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              searchFolder: $(Agent.TempDirectory)/tests
              testResultsFiles: '*.trx'

          - script: dotnet publish HelloWorld -c Release -p:Version=$(version) -o $(Build.ArtifactStagingDirectory)/app
            displayName: Build

          # upload to the feed as a Universal package
          - task: UniversalPackages@0
            inputs:
              command: publish
              publishDirectory: $(Build.ArtifactStagingDirectory)/app
              vstsFeedPublish: HelloWorld/helloworld-feed
              vstsFeedPackagePublish: helloworld
              versionOption: custom
              versionPublish: $(version)

  # ---- only on devops-tasks ----

  - stage: SonarQube
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], variables['tasksBranch']))
    jobs:
      - job: Scan
        steps:
          # full git history for Sonar
          - checkout: self
            fetchDepth: 0

          - task: UseDotNet@2
            inputs:
              version: 10.0.x

          # pinned to an exact version (Sonar flagged @4 as a risk)
          - task: SonarCloudPrepare@4.4.0
            inputs:
              SonarCloud: sonarcloud
              organization: telsek
              scannerMode: dotnet
              projectKey: Telsek_HelloWorld
              # where to find the test coverage file
              extraProperties: |
                sonar.cs.opencover.reportsPaths=$(Agent.TempDirectory)/coverage/**/coverage.opencover.xml

          # build + run the test with coverage, Sonar reads the coverage file
          - script: dotnet test HelloWorld.Tests -c Release --collect "XPlat Code Coverage" --results-directory $(Agent.TempDirectory)/coverage -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
            displayName: Test with coverage

          - task: SonarCloudAnalyze@4.4.0
            inputs:
              jdkversion: JAVA_HOME_21_X64

          - task: SonarCloudPublish@4.4.0

  - stage: NuGet
    dependsOn: SonarQube
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], variables['tasksBranch']))
    jobs:
      - job: Pack
        steps:
          - task: UseDotNet@2
            inputs:
              version: 10.0.x

          - script: dotnet pack HelloWorld -c Release -p:PackageVersion=$(version) -o $(Build.ArtifactStagingDirectory)/nuget
            displayName: Pack

          # logs dotnet in to the feed
          - task: NuGetAuthenticate@1

          # --api-key is required but not used, the login comes from NuGetAuthenticate
          - script: dotnet nuget push $(Build.ArtifactStagingDirectory)/nuget/*.nupkg --source https://pkgs.dev.azure.com/andrei-amzulescu/HelloWorld/_packaging/helloworld-feed/nuget/v3/index.json --api-key az
            displayName: Push

  - stage: Tag
    dependsOn: NuGet
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], variables['tasksBranch']))
    jobs:
      - job: Tag
        steps:
          # name = devops-tasks_<version>, printed + added as a tag
          # branch name comes in through env (Sonar: never put it straight in a script)
          - script: |
              NAME="${BRANCH}_$(version)"
              echo "Version: $(version)"
              echo "Artifact name: $NAME"
              echo "##vso[build.addbuildtag]$NAME"
              echo "##vso[task.setvariable variable=artifactName]$NAME"
            displayName: Name + tag
            env:
              BRANCH: $(Build.SourceBranchName)

          - task: UseDotNet@2
            inputs:
              version: 10.0.x

          - script: dotnet publish HelloWorld -c Release -p:Version=$(version) -o $(Build.ArtifactStagingDirectory)/app
            displayName: Build

          # the build, saved on the run with that name
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/app
              artifact: $(artifactName)

  # ---- email: one of these two runs ----

  - stage: EmailSuccess
    dependsOn: [Build, SonarQube, NuGet, Tag]
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], variables['tasksBranch']))
    variables:
      # SMTP_USER, MAIL_TO, SMTP_PASS (secret) from Library
      - group: email
    jobs:
      - job: Mail
        steps:
          - checkout: none
          - script: |
              cat > mail.txt <<EOF
              From: HelloWorld Pipeline <$SMTP_USER>
              To: $MAIL_TO
              Subject: SUCCESS: HelloWorld $(version) on $BRANCH

              Run $(version) succeeded.
              $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)
              EOF
              curl --ssl-reqd --url smtps://smtp.gmail.com:465 --user "$SMTP_USER:$SMTP_PASS" \
                --mail-from "$SMTP_USER" --mail-rcpt "$MAIL_TO" --upload-file mail.txt
            displayName: Send email
            # secrets have to be passed in by hand, the branch name too (Sonar)
            env:
              SMTP_PASS: $(SMTP_PASS)
              BRANCH: $(Build.SourceBranchName)

  - stage: EmailFailure
    dependsOn: [Build, SonarQube, NuGet, Tag]
    condition: and(failed(), eq(variables['Build.SourceBranch'], variables['tasksBranch']))
    variables:
      - group: email
    jobs:
      - job: Mail
        steps:
          - checkout: none
          - script: |
              cat > mail.txt <<EOF
              From: HelloWorld Pipeline <$SMTP_USER>
              To: $MAIL_TO
              Subject: FAILED: HelloWorld $(version) on $BRANCH

              Run $(version) failed.
              $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)
              EOF
              curl --ssl-reqd --url smtps://smtp.gmail.com:465 --user "$SMTP_USER:$SMTP_PASS" \
                --mail-from "$SMTP_USER" --mail-rcpt "$MAIL_TO" --upload-file mail.txt
            displayName: Send email
            env:
              SMTP_PASS: $(SMTP_PASS)
              BRANCH: $(Build.SourceBranchName)